<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodirjon Tolipov — Student Dashboard</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 32px 16px;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .uni-badge {
            background-color: var(--accent-blue);
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }

        .dashboard-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .user-info-top {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-green);
        }

        .avatar-small {
            width: 34px;
            height: 34px;
            background-color: #1e3a8a;
            color: #93c5fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Welcome Section */
        .welcome-section {
            margin-bottom: 32px;
        }

        .welcome-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 750px;
        }

        /* Quick Metric Cards */
        .grid-quick {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .card-metric {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .metric-value.status-active {
            color: #34d399;
        }

        .metric-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Sections */
        .dashboard-section {
            margin-bottom: 36px;
        }

        .dashboard-section h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .card-block {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }

        .card-block h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .block-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: rgba(255, 255, 255, 0.03);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .block-sub {
            font-size: 0.92rem;
            color: #60a5fa;
            margin-bottom: 14px;
        }

        .task-list {
            list-style-type: disc;
            padding-left: 20px;
            color: var(--text-muted);
            font-size: 0.93rem;
        }

        .task-list li {
            margin-bottom: 8px;
        }

        .small-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Grid for Education & Skills */
        .dual-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 16px;
        }
